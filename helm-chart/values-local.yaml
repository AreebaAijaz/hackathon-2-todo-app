# Local Minikube values
# Usage: helm install taskflow ./helm-chart -f ./helm-chart/values-local.yaml --set-file secrets.databaseUrl=./secrets/db-url.txt ...

frontend:
  image:
    repository: modern-taskflow-frontend
    tag: v3
    pullPolicy: Never  # Use local images
  service:
    type: NodePort
    nodePort: 30080
  env:
    # Must use localhost with port-forward (Docker driver can't expose minikube IP on Windows)
    NEXT_PUBLIC_API_URL: "http://localhost:30081"

backend:
  image:
    repository: modern-taskflow-backend
    tag: v4
    pullPolicy: Never  # Use local images
  service:
    type: NodePort
    nodePort: 30081
  env:
    CORS_ORIGINS: "http://localhost:3000,http://localhost:30080,http://localhost:30081,http://192.168.49.2:30080"
    INTERNAL_SERVICE_USER_ID: "CKadjtyinWNFv5LNcCkLmzsrSjR95dH1"

notificationService:
  image:
    repository: notification-service
    tag: v1
    pullPolicy: Never

recurringService:
  image:
    repository: recurring-service
    tag: v1
    pullPolicy: Never

auditService:
  image:
    repository: audit-service
    tag: v1
    pullPolicy: Never

# For local development, you can set secrets via --set flag:
# helm install taskflow ./helm-chart -f ./helm-chart/values-local.yaml \
#   --set secrets.databaseUrl="postgresql://..." \
#   --set secrets.betterAuthSecret="your-secret" \
#   --set secrets.openaiApiKey="sk-..."
